name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs anteriores en la misma PR para no gastar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle clean check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El toolchain está fijado en .tool-versions (asdf) y
      # gradle/libs.versions.toml. La CI usa temurin 21 (target del
      # proyecto) directamente, sin pasar por asdf, porque el
      # toolchain de Gradle se auto-provisiona con foojay.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run clean check
        # `clean check` ejecuta TODOS los tests, los fitness
        # functions y los AAT. Es la verificación completa de
        # M0..M11. Si este comando pasa, el ROADMAP está verde
        # en lo que el repo puede certificar.
        run: ./gradlew --no-daemon clean check

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore

      # M11.7 — performance budget. Después de que `clean check`
      # pase, medimos el tiempo. Si supera el budget (default
      # 90s), exit 1 y el build rojo. El budget formal sobre
      # fixtures de carga reales (Chronos 10k spans, OTel 100k
      # traces) queda para el segundo pase de M11; aquí se mide
      # sobre el suite de tests actual.
      - name: Performance budget
        if: success()
        run: ./tools/measure-performance.sh --budget 90

      - name: Upload perf baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: build/perf-baseline.txt
          if-no-files-found: ignore

  # M11.6 — security scan con `osv-scanner` sobre el
  # `settings-gradle.lockfile` y el SBOM CycloneDX. La CI
  # aborta si se detecta una vulnerabilidad con severidad >= HIGH.
  # Independiente del job `check`: queremos que el scan corra
  # también en PRs de forks (donde `check` no se ejecuta).
  security-scan:
    name: osv-scanner (lockfile + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El lockfile es la fuente de verdad de qué versiones
      # están en uso. osv-scanner lo ingiere directamente y
      # consulta la base de datos de vulnerabilidades de OSV.
      - name: Generate lockfile if missing
        # `settings-gradle.lockfile` existe en el repo, pero si
        # un cambio introduce una dependencia nueva sin lock,
        # queremos regenerarlo en CI.
        run: |
          if [[ ! -f settings-gradle.lockfile ]]; then
            ./gradlew --no-daemon --write-locks
          fi

      # A5 (Bloque A): generar el SBOM CycloneDX dentro del job
      # para que osv-scanner consuma un artefacto verificable del
      # propio build, no uno preexistente en la rama. El SBOM
      # contiene el árbol transitivo real que se está evaluando.
      - name: Generate SBOM
        if: hashFiles('pipelinek-assurance-plugin/build.gradle.kts') != ''
        run: ./gradlew --no-daemon :pipelinek-assurance-plugin:cyclonedxBom

      - name: Run osv-scanner on lockfile
        # A5 (Bloque A): v1 está obsoleta y falla en CI. v2.x es la
        # línea estable; usamos v2.6.0 (latest). El nombre del step
        # inputs/outputs cambió entre v1 y v2 — en v2 se llama
        # `scan-args` (igual) y el formato de output también, así
        # que la migración es 1:1, sólo cambia el tag de la action.
        uses: google/osv-scanner-action@v2.6.0
        with:
          scan-args: >-
            --lockfile=settings-gradle.lockfile
            --sbom=pipelinek-assurance-plugin/build/reports/bom.json
            --format=markdown
            --output=osv-report.md
            --fail-on=high
        env:
          # osv-scanner consulta la API pública; no necesita
          # credenciales. Si la organización quiere usar un
          # mirror privado, este env var es el punto de override.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload osv report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-report
          path: osv-report.md
          if-no-files-found: ignore

      # A5 (Bloque A): el job debe comprobar que el scan se ejecutó
      # realmente. La action v2 falla el step si encuentra vulns
      # >= high, pero no es prueba suficiente: queremos un marcador
      # explícito de que el artefacto existe. Sin este step, un
      # fallo silencioso de la action (sin report generado, sin
      # exit code != 0) podría pasar.
      - name: Verify osv scan completed
        if: always()
        run: |
          if [[ ! -f osv-report.md ]]; then
            echo "STOP: osv-scanner no produjo osv-report.md."
            echo "El scan no se ejecutó o falló sin generar artefacto."
            exit 1
          fi
          echo "osv scan completed, report size: $(wc -c < osv-report.md) bytes"
